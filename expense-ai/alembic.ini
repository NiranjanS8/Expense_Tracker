[alembic]
script_location = migrations
prepend_sys_path = .
path_separator = os

# The URL is resolved from application settings (DATABASE_URL) in migrations/env.py;
# this value is only a fallback so `alembic` can be imported.
sqlalchemy.url = postgresql+asyncpg://expense_ai:expense_ai@localhost:5432/expense_ai

[loggers]
keys = root,sqlalchemy,alembic

[handlers]
keys = console

[formatters]
keys = generic

[logger_root]
level = WARN
handlers = console
qualname =

[logger_sqlalchemy]
level = WARN
handlers =
qualname = sqlalchemy.engine

[logger_alembic]
level = INFO
handlers =
qualname = alembic

[handler_console]
class = StreamHandler
args = (sys.stderr,)
level = NOTSET
formatter = generic

[formatter_generic]
format = %(levelname)-5.5s [%(name)s] %(message)s
datefmt = %H:%M:%S
