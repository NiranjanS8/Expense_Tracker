name: expense-ai

services:
  expense-ai:
    build:
      context: .
    image: expense-ai:local
    ports:
      # Override with EXPENSE_AI_PORT if 8080 is already taken on the host.
      - "${EXPENSE_AI_PORT:-8080}:8080"
    # Optional: copy .env.example to .env to override any of the defaults below.
    env_file:
      - path: .env
        required: false
    environment:
      # The existing Spring Boot application runs on the host, not in this file:
      # it is deliberately not containerized by this change.
      EXPENSE_TRACKER_BASE_URL: ${EXPENSE_TRACKER_BASE_URL:-http://host.docker.internal:9090}
      EXPENSE_TRACKER_CONTEXT_PATH: ${EXPENSE_TRACKER_CONTEXT_PATH:-/api}
      LLM_PROVIDER: ${LLM_PROVIDER:-fake}
    extra_hosts:
      # Makes host.docker.internal resolve on Linux as well as Docker Desktop.
      - "host.docker.internal:host-gateway"
    restart: unless-stopped
