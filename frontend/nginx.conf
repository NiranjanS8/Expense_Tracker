# Serves the built SPA and keeps the browser on one origin.
#
# `/api` and `/ai` are proxied to the Spring Boot and assistant services, so the
# browser never needs a second origin and the assistant never needs a CORS
# exception. The upstream names are the compose service names; they resolve on the
# staging compose network.

server {
    listen 80;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    # Vite fingerprints every asset, so they can be cached forever. The entry
    # document must not be, or a new build would never be picked up.
    location /assets/ {
        add_header Cache-Control "public, max-age=31536000, immutable";
    }

    location = /index.html {
        add_header Cache-Control "no-store";
    }

    location / {
        try_files $uri $uri/ /index.html;
    }

    # Existing Expense Tracker API. Spring Boot serves it under the /api context
    # path, so the URI is forwarded unchanged.
    location /api/ {
        proxy_pass http://backend:9090;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header Connection "";
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # Read-only assistant. The app calls /ai/*; the service serves /api/v1/*.
    location /ai/ {
        rewrite ^/ai/(.*)$ /api/v1/$1 break;
        proxy_pass http://expense-ai:8080;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header Connection "";
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        # The chat endpoint streams server-sent events; buffering them would hold
        # progress events back until the turn finished.
        proxy_buffering off;
        proxy_cache off;
        proxy_read_timeout 3600s;
        proxy_send_timeout 3600s;
        chunked_transfer_encoding on;
    }
}
